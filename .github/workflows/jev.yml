# Prova AO VIVO da jev-acceptance-action. Este workflow existe SO no fork
# aryrabelo/pi-warden e nunca e proposto ao upstream (DevMortimer/pi-warden).
#
# Por que este repo, e nao ceo-pp ou dotfiles-2026 (medido 2026-09-18):
#   - budget de Actions barra runner HOSPEDADO em repo PRIVADO da conta inteira
#     ("The job was not started because an Actions budget is preventing further use")
#   - em repo PUBLICO `ubuntu-latest` roda (medido: itaruby, 28 de 29 jobs com steps>0)
#   - runner self-hosted e por REPO, e aqui:
#     gh api repos/aryrabelo/pi-warden/actions/runners --jq .total_count -> 0
#   Logo: publico + hospedado e o unico caminho que pega runner hoje.
#
# O `uses:` abaixo consome uma action de repo PRIVADO sem PAT e sem secret extra.
# So funciona por causa de:
#   gh api repos/aryrabelo/jev-acceptance-action/actions/permissions/access
#   -> {"access_level":"user"}   (aberto em 2026-09-18)
# Se esta corrida falhar dizendo que a action nao foi encontrada, e ESSA chave.
name: jev acceptance (prova)

on:
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_dispatch:
    inputs:
      pr:
        description: numero do PR a julgar
        required: true

permissions:
  contents: read
  pull-requests: read
  issues: read

jobs:
  acceptance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      # VENDORIZADA, e a razao e' MEDIDA, nao preferencia. Tentei antes
      # `uses: aryrabelo/jev-acceptance-action@main` e a corrida 35383308078 morreu no
      # "Set up job" com a linha literal:
      #   Unable to resolve action `aryrabelo/jev-acceptance-action`, not found
      # mesmo com {"access_level":"user"} aberto. O access_level compartilha a action
      # com outros repos PRIVADOS do mesmo dono; repo PUBLICO nao alcanca action
      # privada, por desenho. E como repo privado desta conta nao pega runner
      # hospedado (budget) nem tem self-hosted registrado, as duas condicoes sao
      # mutuamente exclusivas hoje -- por isso a prova ao vivo roda com a action
      # copiada pra dentro deste repo.
      # SEM continue-on-error, de proposito. Ele existia porque a action saia com o
      # exit code do veredito (3 humano, 4 fail-open) e derrubaria o job -- so que
      # step com conclusion=failure faz o GitHub APAGAR os outputs, entao o consumidor
      # recebia string vazia exatamente nos casos interessantes (medido: run
      # 35387669508, controle fora da banda, `exit_code=''`). Hoje a action sempre
      # termina 0 e o veredito viaja nos outputs; manter o continue-on-error aqui so
      # voltaria a mascarar quebra de verdade.
      - id: jev
        uses: ./.github/actions/jev
        with:
          pr: ${{ inputs.pr || github.event.pull_request.number }}
          openrouter_api_key: ${{ secrets.OPENROUTER_API_KEY }}

      # O secret nunca e ecoado: so os outputs da action.
      - name: o que o Jev disse
        run: |
          set -uo pipefail
          exit_code='${{ steps.jev.outputs.exit_code }}'
          human='${{ steps.jev.outputs.human }}'
          fail_open='${{ steps.jev.outputs.fail_open_triggered }}'
          control_status='${{ steps.jev.outputs.control_status }}'

          vazios=''
          [ -z "$exit_code" ] && vazios='exit_code'
          [ -z "$control_status" ] && vazios="${vazios:+$vazios e }control_status"
          if [ -n "$vazios" ]; then
            printf '::error title=Jev nao rodou::a action nao exportou %s. Ela falhou ANTES de escrever o GITHUB_OUTPUT e o continue-on-error mascarou o job como verde -- output vazio NAO e veredito. Abra o log do step jev e procure outcome=failure.\n' "$vazios"
            exit 1
          fi

          printf 'exit_code=%s human=%s fail_open=%s control=%s\n' \
            "$exit_code" "$human" "$fail_open" "$control_status"

          if [ "$exit_code" = '4' ]; then
            echo '::warning title=Jev sem veredito::fail-open — o PR NAO foi reprovado, mas ninguem julgou o aceite.'
          fi
          if [ "$exit_code" = '2' ]; then
            echo '::error title=.jev/acceptance.yml invalido::corrija o contrato de aceite do repo.'
            exit 1
          fi
          # O controle nunca reprova o PR: ele diz se o VEREDITO vale.
          case "$control_status" in
            fora_da_banda)
              echo '::warning title=Jev descartou o veredito::controle calibrado fora da banda — o juiz errou um caso de resposta conhecida nesta corrida. Nome, valor e banda no Summary.' ;;
            ausente)
              echo '::notice title=Jev sem controle::esta corrida rodou SEM controle calibrado: nada nela diz se o juiz esta calibrado. Declare `control:` no .jev/acceptance.yml.' ;;
            erro)
              echo '::warning title=Jev com controle ilegivel::nao foi possivel ler o controle desta corrida; trate o veredito como NAO auditado (erro nunca e ok).' ;;
          esac
