# Contrato de aceite deste repositório, lido pelas duas metades (GitHub Action e CLI
# local). Uma regra de aceite, um arquivo. Este exemplo está escrito para
# aryrabelo/dotfiles-2026 (nix-darwin + home-manager).
#
# Ausência deste arquivo = no-op silencioso, exit 0, nenhuma requisição gasta.
version: 1

model: typesafe/jev-1.13

# Tudo é contexto: uma lista achatada de FONTES, montada nesta ordem, rotulada por
# seção. Nenhuma fonte é privilegiada — tirar `issue.body` daqui faz a seção desaparecer
# do texto, igual a qualquer outra.
context:
  - pr.title
  - pr.body
  - pr.commits
  - pr.diffstat
  - issue.body # a issue que o PR fecha (closingIssuesReferences)
  - issue.ancestors # a cadeia pai -> pai -> ... até o épico raiz
  - issue.next # uma hop: irmãs no mesmo pai + quem depende desta

# Passam CRUAS para o Jev, numa única requisição.
# noul  -> instructions (string); a resposta é uma PROBABILIDADE 0..1, nunca booleano
# choice-> instructions (string) + criteria (map rótulo -> rubrica)
# score -> instructions (string) + criteria (lista, do menor ao maior)
questions:
  atende:
    type: noul
    instructions: "O PR entrega o que a issue pediu, lida junto com a intenção do épico raiz?"
  alinhado:
    type: noul
    instructions: "A abordagem escolhida é coerente com o plano descrito nos ancestrais, em vez de uma solução local que ignora o desenho?"
  escopo:
    type: choice
    instructions: "Classifique o escopo entregue por este PR em relação ao que ESTA issue pediu."
    criteria:
      dentro: "faz exatamente o escopo desta issue"
      faltou: "deixa de fora parte do que esta issue pedia"
      extrapolou: "faz trabalho que pertence a uma issue seguinte"
  atrapalha_proximo:
    type: noul
    instructions: "A forma escolhida cria obstáculo para as issues que vêm em seguida (encurrala a próxima etapa)?"
  risco:
    type: score
    instructions: "Quão sensível é a superfície que este PR toca neste repositório de dotfiles (nix-darwin + home-manager), lendo os caminhos do diffstat?"
    criteria:
      - "só docs, README ou NEXT_STEPS.md — nada que o switch execute"
      - "só test/ ou scripts de diagnóstico — não entra no sistema de ninguém"
      - "home/** ou dotfiles/** — muda a máquina do humano no próximo switch, mas é reversível por rollback do home-manager"
      - "modules/**, hosts/**, flake.nix ou bin/update-tools — pode quebrar o switch, o bootstrap ou a atualização de ferramentas da frota inteira"

# Polaridade mora AQUI, não em questions (chave extra em questions = 400 no wire).
routing:
  human_below: 0.7 # noul comum abaixo disso -> pede humano
  expect_low: [atrapalha_proximo] # noul ALTO aqui -> pede humano (inverte)
  expect_label: { escopo: dentro } # choice fora disso -> pede humano
  labels: true
  label_human: "jev:humano"
  label_ok: "jev:ok"

# ------------------------------------------------------------------- controle calibrado
# Casos de resposta CONHECIDA, julgados na MESMA corrida do PR. Sem isto, `atende: 0.88`
# não é auditável: nada na corrida diz se o juiz está calibrado ou se ele responderia
# 0.88 para qualquer coisa. Cada controle é UMA requisição extra (o Jev recebe um `state`
# por requisição), e é por isso que o teto é 2 — o preço é o motivo do teto.
#
# Os DOIS existem porque há dois jeitos opostos de o juiz quebrar, e um controle só pega
# um deles:
#   - o NEGATIVO pega o juiz que diz SIM PRA TUDO: se um PR que só mexe no README passar
#     de 0.15, o `atende: 0.88` do PR real não vale nada;
#   - o POSITIVO pega o juiz que diz NÃO PRA TUDO (modelo degradado, rota errada, prompt
#     quebrado): se a entrega exemplar ficar abaixo de 0.82, o "não atende" do PR real é
#     do juiz, não do PR.
#
# Controle reprovado DESCARTA o veredito do PR: exit 4, routing.human=true,
# fail_open_triggered=true. Nunca aprova, nunca reprova o PR — chama humano.
#
# CALIBRAÇÃO: a banda é medida contra o PRÓPRIO texto do `state` que está logo abaixo
# dela, nunca contra um texto parecido. Receita reproduzível, números e o incidente que
# criou esta regra: docs/calibracao-do-controle.md. Regra curta: 8 repetições do payload
# REAL (model + state + TODAS as questions deste arquivo), banda = pior caso medido com
# margem de 0.10.
#
# Medido em 2026-09-18 contra typesafe/jev-1.13 no endpoint real, pergunta `atende`,
# 8 repetições por estado, payload idêntico ao que a Action manda:
#   negativo  0.02 ×8                                 -> min 0.02 max 0.02 jitter 0.00
#   positivo  0.93 0.92 0.93 0.93 0.93 0.92 0.92 0.93 -> min 0.92 max 0.93 jitter 0.01
# US$ 0.0000278 (negativo) a 0.0000309 (positivo) por requisição, com as 5 perguntas
# juntas; as 16 repetições desta leitura custaram US$ 0.00047. Jitter medido nesta
# família: 0.00 a 0.03 — margem menor que ~0.05 é flaky por construção, e é por isso
# que a margem exigida é 0.10.
control:
  - name: pr_vazio_nao_atende
    # `state` é texto FIXO no arquivo, nunca derivado do PR em julgamento: é justamente
    # por ser conhecido que ele mede o juiz.
    state: "PR: 'docs: corrige typo no README'. Diffstat: 1 1 README.md. A issue que este PR fecha pede: implementar o endpoint POST /aceite e cobri-lo com teste."
    expect:
      # NEGATIVO: medido 0.02 ×8 em 2026-09-18 (pior caso já registrado neste texto:
      # 0.05, na leitura de 6 repetições do mesmo dia) -> banda 0.15, margem de 0.10
      # sobre esse pior caso e de 0.13 sobre o medido hoje.
      #
      # Apertada de 0.89 para 0.15 com razão medida: 0.89 fica ACIMA de
      # routing.human_below=0.7, então um juiz derivado que respondesse 0.85 para um PR
      # de typo no README passava no controle E aprovava sozinho o PR real — exatamente
      # o juiz "diz SIM pra tudo" que este caso existe para pegar. A banda precisa
      # tropeçar ANTES da zona em que o juiz consegue emitir veredito: 0.15 tropeça,
      # 0.89 não. Controle negativo trocado por humano custa uma revisão; controle
      # negativo cego custa um merge errado.
      atende: { max: 0.15 }
  - name: pr_exemplar_atende
    # Texto REESCRITO em 2026-09-18. O anterior media 0.78 ×8 contra a banda min 0.89 e
    # reprovava sozinho — foi ele que descartou um veredito legítimo na run 35387669508.
    # O 0.94 que justificava aquela banda tinha sido medido em OUTRO texto. E a hesitação
    # tinha motivo nomeável: a pergunta `atende` cita a intenção do épico raiz e o state
    # não trazia épico nenhum, então 0.78 era o juiz certo respondendo a um texto
    # incompleto. Este texto fecha a lacuna (épico, issue, e o que NÃO entrou).
    state: "PR: 'feat: endpoint POST /aceite + teste'. Diffstat: 64 0 src/aceite.py / 41 0 tests/test_aceite.py. A issue que este PR fecha pede, literalmente: implementar o endpoint POST /aceite e cobri-lo com teste. O épico raiz pede: expor a API de aceite, um endpoint por issue, cada um com teste. Este PR faz exatamente isso e nada além: nenhum item da issue ficou de fora, nenhum trabalho de outra issue entrou. Suite verde."
    expect:
      # POSITIVO: medido 0.92-0.93 (8 repetições) em 2026-09-18 -> banda 0.82, margem de
      # 0.10 sobre o pior caso medido, 10x o jitter de 0.01 deste texto.
      #
      # 0.82 fica ACIMA de routing.human_below=0.7 de propósito. A alternativa era manter
      # o texto de 0.78 e baixar a banda para 0.66, e isso mataria o controle: banda
      # positiva abaixo do limiar humano é satisfeita por valores que já são "não
      # atende", ou seja, um juiz degradado respondendo 0.68 para tudo passaria no
      # controle enquanto mandava todo PR para revisão humana. Por isso o caminho foi
      # reescrever o texto, não afrouxar a banda.
      atende: { min: 0.82 }

# 403 de cota, 429, 5xx, timeout e erro de ferramenta NUNCA reprovam o PR.
fail_open: true
